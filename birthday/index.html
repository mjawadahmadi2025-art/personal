<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Happy Birthday</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <style>
    body {
      margin: 0;

      min-height: 100vh;

      padding: 20px;

      background: linear-gradient(135deg, #1e1e2f, #2b2b4f);

      display: flex;

      justify-content: center;

      align-items: center;

      font-family: Tahoma, sans-serif;
    }

    /* کارت کلی */
    .card {
      background: #fff5e6;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255, 182, 193, 0.6);
      margin-top: 80px;
    }

    h1 {
      margin: 0;
    }
    h2 {
      position: relative;
      top: -40px;
    }

    /* کیک */
    .cake {
      width: 120px;
      height: 70px;
      background: linear-gradient(
        to bottom,
        #a0522d 0%,
        #8b4513 50%,
        #6b3410 100%
      );
      margin: 20px auto;
      border-radius: 12px;
      position: relative;
      box-shadow:
        inset 0 -8px 0 rgba(0, 0, 0, 0.25),
        0 8px 15px rgba(0, 0, 0, 0.3);
    }

    /* خامه موج‌دار */
    .cake::before {
      content: "";
      position: absolute;
      top: -18px;
      left: 0;
      width: 120px;
      height: 35px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 5px 8px rgba(0, 0, 0, 0.15);
    }

    /* چکه‌های خامه */
    .cake::after {
      content: "";
      position: absolute;
      top: -5px;
      left: 15px;
      width: 20px;
      height: 25px;
      background: white;
      border-radius: 50%;
      box-shadow:
        30px 5px 0 white,
        60px 0px 0 white,
        68px 2px 0 white,
        -18px 1.5px 0 white;
    }

    /* شمع */
    .candle {
      width: 8px;
      height: 25px;
      background: red;
      position: absolute;
      top: -42px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* شعله */
    .flame {
      width: 12px;
      height: 18px;
      background: orange;
      border-radius: 50%;
      position: absolute;
      top: -18px;
      left: -2px;
      animation: flicker 0.2s infinite alternate;
      box-shadow: 0 0 15px yellow;
    }
    @keyframes flicker {
      from {
        transform: scale(1);
        opacity: 0.8;
      }
      to {
        transform: scale(1.1);
        opacity: 1;
      }
    }
    canvas#confetti {
      position: fixed; /* همیشه روی صفحه بمونه */
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* اجازه بده کلیک روی کارت کار کنه */
      z-index: 0; /* پشت کارت */
    }

    /* کارت روی canvas بمونه */
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      width: min(90vw, 420px);

      min-height: 450px;

      padding: 25px;

      text-align: center;

      border-radius: 25px;

      background: #fff5e6;

      box-shadow: 0 0 40px rgba(255, 182, 193, 0.6);

      z-index: 1;
    }

    p {
      margin-top: 30px;
      color: #555;
    }
    .msg-btn {
      background: #ffb6c1;
      color: #5a3e36;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.5);
    }

    .msg-btn:hover {
      transform: scale(1.05);
    }

    .hidden-message {
      max-height: 0;
      overflow: hidden;
      opacity: 0;

      margin-top: 15px;
      color: #555;
      line-height: 1.8;

      transition:
        max-height 0.8s ease,
        opacity 0.8s ease;
    }

    .hidden-message.show {
      max-height: 250px;
      opacity: 1;
    }
    @media (max-width: 430px) {
      .card {
        width: 92%;
        padding: 20px;
        min-height: auto;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 22px;
        top: -20px;
      }

      .cake {
        width: 100px;
        height: 60px;
      }

      .cake::before {
        width: 100px;
      }

      .msg-btn {
        width: 100%;
        font-size: 15px;
      }

      .hidden-message {
        font-size: 14px;
      }
    }
  </style>
  <body>
    <div class="card">
      <h1>HAPPY BIRTHDAY</h1>
      <h2>✨ fatemeh ✨</h2>

      <div class="cake">
        <div class="candle">
          <div class="flame"></div>
        </div>
      </div>

      <button class="msg-btn" onclick="showMessage()">
        🎉 Birthday Message
      </button>

      <div id="birthdayMessage" class="hidden-message">
        Happy Birthday Fatemeh 🥳 <br /><br />
        May your days be filled with happiness, success, beautiful memories and
        endless smiles ✨🎂🌸<br style="line-height: 85%;">
        And also, you are the most beautiful cousin in the world💖
        
      </div>
    </div>

    <canvas id="confetti"></canvas>

    <script>
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let confetti = [];

      for (let i = 0; i < 150; i++) {
        confetti.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 5 + 2,
          speed: Math.random() * 3 + 2,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`,
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        confetti.forEach((c) => {
          ctx.fillStyle = c.color;
          ctx.fillRect(c.x, c.y, c.size, c.size);

          c.y += c.speed;

          if (c.y > canvas.height) {
            c.y = 0;
            c.x = Math.random() * canvas.width;
          }
        });

        requestAnimationFrame(draw);
      }

      draw();
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resizeCanvas);
      function showMessage() {
        document.getElementById("birthdayMessage").classList.toggle("show");
      }
    </script>
  </body>
</html>
